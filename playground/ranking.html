<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playground do ranking | Agulhão Charts</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #172033;
            background: #eef1f6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
        }

        button,
        input,
        select {
            font: inherit;
        }

        .pagina {
            width: min(1180px, 100%);
            margin: 0 auto;
            padding: 40px 24px 56px;
        }

        .topo {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 24px;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: #2563eb;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(28px, 4vw, 42px);
            line-height: 1.08;
            letter-spacing: -.035em;
        }

        .descricao {
            max-width: 620px;
            margin: 12px 0 0;
            color: #637083;
            font-size: 15px;
            line-height: 1.6;
        }

        .layout {
            display: grid;
            grid-template-columns: 260px minmax(0, 1fr);
            gap: 20px;
            align-items: start;
        }

        .painel,
        .preview {
            border: 1px solid #dce2eb;
            border-radius: 14px;
            background: #ffffff;
            box-shadow: 0 12px 32px rgba(23, 32, 51, .07);
        }

        .painel {
            position: sticky;
            top: 20px;
            padding: 18px;
        }

        .painel h2,
        .preview-cabecalho h2 {
            margin: 0;
            font-size: 14px;
        }

        .controles {
            display: grid;
            gap: 18px;
            margin-top: 20px;
        }

        .controle {
            display: grid;
            gap: 8px;
        }

        .controle-linha {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .controle label,
        .controle-linha label {
            color: #3d4859;
            font-size: 13px;
            font-weight: 650;
        }

        .controle small {
            color: #7b8696;
            font-size: 11px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #2563eb;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin: 0;
            accent-color: #2563eb;
        }

        select {
            width: 100%;
            border: 1px solid #cfd6e1;
            border-radius: 8px;
            padding: 8px 10px;
            color: #263244;
            background: #ffffff;
        }

        .preview {
            min-width: 0;
            overflow: hidden;
        }

        .preview-cabecalho {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            border-bottom: 1px solid #e4e8ef;
            padding: 14px 18px;
        }

        .medida {
            border-radius: 999px;
            padding: 5px 9px;
            color: #536174;
            background: #f0f3f8;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 11px;
        }

        .palco {
            min-height: 680px;
            padding: 24px;
            overflow: auto;
            background-color: #f6f7fa;
            background-image: radial-gradient(#d8dde7 1px, transparent 1px);
            background-size: 16px 16px;
        }

        #moldura {
            max-width: 100%;
            height: 630px;
            margin: 0 auto;
            overflow: hidden;
            border: 1px solid #d9dee7;
            border-radius: 10px;
            background: #ffffff;
            box-shadow: 0 10px 26px rgba(29, 38, 55, .09);
            transition: width 180ms ease;
        }

        #grafico {
            width: 100%;
            height: 100%;
        }

        .aviso-carregamento {
            display: grid;
            place-items: center;
            height: 100%;
            padding: 32px;
            color: #637083;
            text-align: center;
            line-height: 1.6;
        }

        .aviso-carregamento code {
            border-radius: 5px;
            padding: 2px 6px;
            color: #1e40af;
            background: #e8efff;
        }

        @media (max-width: 760px) {
            .pagina {
                padding: 24px 14px 40px;
            }

            .layout {
                grid-template-columns: 1fr;
            }

            .painel {
                position: static;
            }

            .palco {
                padding: 14px;
            }
        }
    </style>
</head>
<body>
    <main class="pagina">
        <header class="topo">
            <div>
                <p class="eyebrow">Playground</p>
                <h1>Total do ranking</h1>
                <p class="descricao">Teste o componente real em diferentes larguras, alterne a exibição do total e compare a formatação numérica.</p>
            </div>
        </header>

        <div class="layout">
            <aside class="painel" aria-label="Controles do playground">
                <h2>Configuração</h2>
                <div class="controles">
                    <div class="controle-linha">
                        <label for="mostrar-total">Mostrar total</label>
                        <input id="mostrar-total" type="checkbox" checked>
                    </div>

                    <div class="controle-linha">
                        <label for="mostrar-podio">Mostrar pódio</label>
                        <input id="mostrar-podio" type="checkbox" checked>
                    </div>

                    <div class="controle">
                        <div class="controle-linha">
                            <label for="largura">Largura</label>
                            <small id="largura-valor">720 px</small>
                        </div>
                        <input id="largura" type="range" min="320" max="840" step="10" value="720">
                    </div>

                    <div class="controle">
                        <label for="formato">Formato dos valores</label>
                        <select id="formato">
                            <option value="numero">Número</option>
                            <option value="moeda" selected>Moeda (BRL)</option>
                            <option value="compacto">Compacto</option>
                        </select>
                    </div>
                </div>
            </aside>

            <section class="preview">
                <header class="preview-cabecalho">
                    <h2>Pré-visualização</h2>
                    <span id="medida" class="medida">720 × 630</span>
                </header>
                <div class="palco">
                    <div id="moldura">
                        <section id="grafico" class="agulhao-ranking"></section>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        window.addEventListener('load', () => {
            window.setTimeout(() => {
                const grafico = document.querySelector('#grafico')

                if (grafico && grafico.childElementCount === 0) {
                    grafico.innerHTML = '<div class="aviso-carregamento">O componente não foi carregado. Execute <code>npm run playground</code> e abra a URL iniciada pelo Vite.</div>'
                }
            }, 1200)
        })
    </script>

    <script type="module">
        import { CSS_RANKING_GRAFICO, criarHtmlRankingGrafico } from '../packages/core/src/index.ts'

        const styleRanking = document.createElement('style')
        styleRanking.textContent = CSS_RANKING_GRAFICO
        document.head.appendChild(styleRanking)

        const elementos = {
            grafico: document.querySelector('#grafico'),
            moldura: document.querySelector('#moldura'),
            mostrarTotal: document.querySelector('#mostrar-total'),
            mostrarPodio: document.querySelector('#mostrar-podio'),
            largura: document.querySelector('#largura'),
            larguraValor: document.querySelector('#largura-valor'),
            formato: document.querySelector('#formato'),
            medida: document.querySelector('#medida'),
        }

        const dados = [
            { nome: 'Juliana', total: 330000 },
            { nome: 'Eduardo', total: 300000 },
            { nome: 'Helena', total: 270000 },
            { nome: 'Bruno', total: 240000 },
            { nome: 'Gabriel', total: 210000 },
            { nome: 'Carla', total: 180000 },
            { nome: 'Fernanda', total: 150000 },
            { nome: 'Ana', total: 120000 },
            { nome: 'Diego', total: 90000 },
            { nome: 'Igor', total: 60000 },
        ]

        function criarFormatador(formato) {
            if (formato === 'moeda') {
                return (valor) => new Intl.NumberFormat('pt-BR', {
                    style: 'currency',
                    currency: 'BRL',
                    maximumFractionDigits: 0,
                }).format(valor)
            }

            if (formato === 'compacto') {
                return (valor) => new Intl.NumberFormat('pt-BR', {
                    notation: 'compact',
                    maximumFractionDigits: 1,
                }).format(valor)
            }

            return (valor) => new Intl.NumberFormat('pt-BR').format(valor)
        }

        function renderizar() {
            const largura = Number(elementos.largura.value)
            elementos.moldura.style.width = `${largura}px`
            elementos.larguraValor.textContent = `${largura} px`
            elementos.medida.textContent = `${largura} × 630`

            elementos.grafico.innerHTML = criarHtmlRankingGrafico({
                tipo: 'ranking',
                titulo: 'Ranking de vendedores',
                dataset: { linhas: dados },
                mapeamento: {
                    rotulo: 'nome',
                    valor: 'total',
                },
                opcoes: {
                    subtitulo: 'Receita acumulada no trimestre',
                    ranking: {
                        mostrarTotal: elementos.mostrarTotal.checked,
                        mostrarPodio: elementos.mostrarPodio.checked,
                        formatadorValor: criarFormatador(elementos.formato.value),
                    },
                },
            })
        }

        elementos.mostrarTotal.addEventListener('change', renderizar)
        elementos.mostrarPodio.addEventListener('change', renderizar)
        elementos.largura.addEventListener('input', renderizar)
        elementos.formato.addEventListener('change', renderizar)
        renderizar()
    </script>
</body>
</html>
