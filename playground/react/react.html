<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playground do React | Agulhão Charts</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #172033;
        }

        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
        }

        select {
            font: inherit;
            border: 1px solid #cfd6e1;
            border-radius: 8px;
            padding: 8px 10px;
            color: #263244;
            background: #ffffff;
        }

        header {
            border-bottom: 1px solid #e4e8ef;
            padding: 8px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
        }

        .pagina {
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
        }

        .descricao {
            max-width: 620px;
            color: #637083;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .descricao code {
            border-radius: 5px;
            padding: 2px 6px;
            color: #1e40af;
            background: #e8efff;
        }

        .preview {
            padding: 34px;
        }

        .dashboard {
            flex: 1;
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="app"></div>

    <script type="module" src="./react.tsx"></script>
</body>

</html>
